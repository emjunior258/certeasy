[pytest]
# Add custom options here

# Disable parallel execution (force tests to run sequentially)
;addopts = --workers=1

# Specify test file naming convention (e.g., test_*.py)
python_files = test_*.py

# Specify custom markers to categorize tests
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')

# Specify plugins to load
plugins =
    custom_delay_plugin
